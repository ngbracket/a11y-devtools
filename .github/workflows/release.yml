name: Release

# Publishes the current package.json version to npm via OIDC trusted publishing
# (no token/OTP). Trigger manually once the version has been bumped + merged.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - name: Diagnostics
        run: |
          echo "npm: $(npm --version)"
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
          echo "OIDC request token present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+YES}"
          echo "registry: $(npm config get registry)"
      - run: npm ci
      - run: npm run build
      - run: npm test
      # setup-node writes an _authToken=${NODE_AUTH_TOKEN} line; with no token it
      # breaks auth. Strip it so npm falls through to OIDC trusted publishing.
      - run: 'sed -i "/_authToken/d" "$NPM_CONFIG_USERCONFIG" || true'
      - run: npm publish
