name: Release

# Publishes the current package.json version to npm via OIDC trusted publishing
# (no token/OTP). Trigger manually once the version has been bumped + merged.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing is the 11.5.x line; npm@latest (12.x) doesn't
      # initiate the OIDC exchange here (ENEEDAUTH). Pin to 11.
      - run: npm install -g npm@^11.5
      - run: npm --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}`; with no
      # token that empty value hijacks auth (404) instead of letting npm 11 fall
      # through to OIDC. Strip the line but keep the registry setting.
      - run: 'sed -i "/_authToken/d" "$NPM_CONFIG_USERCONFIG"'
      - run: npm publish
