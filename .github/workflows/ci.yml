name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      # The real-browser E2E spec (src/testing/e2e-report.spec.ts) skips itself
      # without a Playwright Chromium — install one so it actually runs in CI.
      - run: npx playwright install --with-deps chromium
      # Includes the production-weight guard (src/testing/prod-weight.spec.ts):
      # fails if axe-core ever becomes statically reachable from the entry.
      - run: npm test
